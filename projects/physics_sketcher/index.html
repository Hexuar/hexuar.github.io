<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="style.css">
    <script src="../../engine/engine.js"></script>
</head>
<body>
    <div class="ui">
        <button onclick="mode='ball'" onmouseenter="mouseActivated = false" onmouseleave="mouseActivated = true"> Ball </button>
        <button onclick="mode='box'" onmouseenter="mouseActivated = false" onmouseleave="mouseActivated = true"> Box </button>
        <button onclick="mode='line'" onmouseenter="mouseActivated = false" onmouseleave="mouseActivated = true"> Line </button>
    </div>
    <dialog id="interactionDialog">
        <input type="text" onmouseenter="mouseActivated = false; console.log('ENTERED')" onmouseleave="mouseActivated = true">
    </dialog>

</body>
