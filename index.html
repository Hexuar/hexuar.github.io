<!doctype html>

<head>
    <title>Hexuar</title>

    <link rel="stylesheet" href="styles/main.css" />

    <script src="scripts/loadhtml.js"></script>
</head>

<body>
    <!-- Navigation bar -->
    <script>
        loadHTML("navbar.html");
    </script>

    <!-- News Panel -->
    <div class="panel">
        <h1>Newest Entry</h1>
        <div style="display: flex; justify-content: center; column-gap: 20px; margin: 20px;">
            <iframe id="latestFrame" style="width: 20%; aspect-ratio: 2 / 1;"></iframe>
            <div style="position: relative; width: 20%;">
                <h3 id="latestTitle"></h3>
                <p id="latestDesc"></p>
                <p id="latestInfo"></p>
                <div style="position: absolute; bottom: 0;"><p id="latestTimestamp"></p></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/latest.js"></script>
</body>
