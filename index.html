<!doctype html>

<head>
    <title>Hexuar</title>

    <link rel="stylesheet" href="styles/main.css" />

    <script src="scripts/loadhtml.js"></script>
</head>

<body>
    <!-- Navigation bar -->
    <script>
        loadHTML("navbar.html");
    </script>

    <!-- Featured Panel -->
    <div class="panel">
        <h1>Featured Entry</h1>
        <div style="display: flex; justify-content: center; column-gap: 20px; margin: 20px;">
            <iframe id="featuredFrame" style="width: 50%; aspect-ratio: 2 / 1;"></iframe>
            <div class="panel" style="margin: 0px; width: 20%; background-color: rgba(0.1, 0.1, 0.1, 0.1); position: relative;">
                <h3><a id="featuredTitle" style="color:  rgba(255, 255, 255, 0.7); text-decoration: none;"></a></h3>
                <p id="featuredDesc"></p>
                <p id="featuredInfo"></p>
                <div style="position: absolute; bottom: 0; right: 20px;"><p id="featuredTimestamp"></p></div>
            </div>
        </div>
    </div>

    <!-- News Panel -->
    <div class="panel">
        <h1>Latest Entry</h1>
        <div style="display: flex; justify-content: center; column-gap: 20px; margin: 20px;">
            <iframe id="latestFrame" style="width: 50%; aspect-ratio: 2 / 1;"></iframe>
            <div class="panel" style="margin: 0px; width: 20%; background-color: rgba(0.1, 0.1, 0.1, 0.1); position: relative;">
                <h3><a id="latestTitle" style="color:  rgba(255, 255, 255, 0.7); text-decoration: none;"></a></h3>
                <p id="latestDesc"></p>
                <p id="latestInfo"></p>
                <div style="position: absolute; bottom: 0; right: 20px;"><p id="latestTimestamp"></p></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/latest.js"></script>
    <script src="scripts/featured.js"></script>
</body>
